<script>
(function () {
  var WA_URL = 'https://api.whatsapp.com/send?phone=5547999522331&text=Ol%C3%A1%2C%20gostaria%20de%20comprar%20no%20atacado!';
  var cta = document.getElementById('cta-whatsapp');
  var opened = false;
  var startX = 0;
  var startY = 0;

  function warm() {
    var link = document.createElement('link');
    link.rel = 'prefetch';
    link.href = WA_URL;
    link.as = 'document';
    document.head.appendChild(link);
  }

  cta.addEventListener('pointerenter', warm, { once: true, passive: true });
  cta.addEventListener('touchstart', warm, { once: true, passive: true });

  function goWhatsApp(e) {
    if (opened) return;
    opened = true;
    if (e) e.preventDefault();

    // Pixel não bloqueia o redirect (fbq usa sendBeacon)
    try {
      if (typeof fbq === 'function') {
        fbq('track', 'Contact', {}, { eventID: 'wa_' + Date.now() });
      }
    } catch (_) {}

    // Same-tab: abre o app do WhatsApp mais rápido no mobile
    window.location.href = WA_URL;
  }

  cta.addEventListener('pointerdown', function (e) {
    startX = e.clientX;
    startY = e.clientY;
  }, { passive: true });

  // pointerup dispara antes do click no mobile
  cta.addEventListener('pointerup', function (e) {
    if (e.pointerType !== 'touch' && e.pointerType !== 'pen') return;
    if (Math.abs(e.clientX - startX) > 12 || Math.abs(e.clientY - startY) > 12) return;
    goWhatsApp(e);
  }, { passive: false });

  cta.addEventListener('click', goWhatsApp);
})();
</script>
